flutter_native_splash:

  # Platforms
  android: true
  ios: true
  web: false

  # Main background colors
  color: "#FFFFFF"
  color_dark: "#121212"

  # Splash images
  image: assets/images/splash_logo.png
  image_dark: assets/images/splash_logo.png

  # Optional background images

  #  background_image: assets/images/splash_background.png
  #  background_image_dark: assets/images/splash_background_dark.png

  # Branding images

  #  branding: assets/images/branding.png
  #  branding_dark: assets/images/branding_dark.png

  # Branding position
  branding_mode: bottom

  # Fullscreen
  fullscreen: true

  # Image positioning
  android_gravity: center
  ios_content_mode: center
  web_image_mode: contain





  # Android 12+
  android_12:
    color: "#FFFFFF"
    color_dark: "#121212"

    image: assets/images/splash_logo.png
    image_dark: assets/images/splash_logo.png

#    branding: assets/images/branding.png
#    branding_dark: assets/images/branding_dark.png

#    icon_background_color: "#FFFFFF"
#    icon_background_color_dark: "#121212"