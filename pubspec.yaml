name: stylish
description: A scalable Flutter eCommerce application built with MVVM architecture, responsive UI, localization support, and clean design system principles.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Navigation
  go_router: ^17.1.0

  # Networking
  internet_connection_checker_plus: ^2.9.1+2
  dio: ^5.9.2

  # State Management
  fpdart: ^1.2.0
  equatable: ^2.0.7
  flutter_bloc: ^9.1.1

  # Backend – Firebase

  # Backend – Supabase

  # Backend – Appwrite

  # Storage
  hive_ce: ^2.19.3
  hive_ce_flutter: ^2.3.4
  shared_preferences: ^2.5.4
  flutter_secure_storage: ^10.0.0

  # Images & SVG
  cached_network_image: ^3.4.1
  flutter_svg: ^2.2.4

  # Icons
  iconsax_plus: ^1.0.0

  # Shimmer / Skeleton
  skeletonizer: ^2.1.3

  # Responsive UI
  flutter_screenutil: ^5.9.3

  # Animations
  flutter_animate: ^4.5.2
  smooth_page_indicator: ^2.0.1

  # Environment

  # Logging
  logger: ^2.6.2

  # Media
  image_picker: ^1.2.1

  # Utilities
  crypto: ^3.0.7
  connectivity_plus: ^7.1.1

  # Device & System


  # Localization
  easy_localization: ^3.0.8

  flutter_native_splash: ^2.4.7
  get_it: ^9.2.1
  intl: ^0.20.2
  pretty_dio_logger: ^1.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Code Generation
  build_runner: ^2.12.2
  hive_ce_generator: ^1.11.1

dependency_overrides:

flutter:
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/translations/

