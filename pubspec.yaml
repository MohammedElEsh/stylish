name: stylish
description: A scalable Flutter eCommerce application built with MVVM architecture, responsive UI, localization support, and clean design system principles.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter_skill: ^0.9.36
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.9

  # Navigation
  go_router: ^17.3.0

  # Networking
  internet_connection_checker_plus: ^3.0.1
  dio: ^5.9.2

  # State Management
  fpdart: ^1.2.0
  equatable: ^2.0.8
  flutter_bloc: ^9.1.1

  # Backend – Firebase

  # Backend – Supabase

  # Backend – Appwrite

  # Storage
  hive_ce: ^2.19.3
  hive_ce_flutter: ^2.3.4
  shared_preferences: ^2.5.5
  flutter_secure_storage: ^10.3.1

  # Images & SVG
  cached_network_image: ^3.4.1
  flutter_svg: ^2.3.0

  # Icons
  hugeicons: ^1.1.7

