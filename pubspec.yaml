  easy_localization: ^3.0.8

  flutter_native_splash: ^2.4.8
  get_it: ^9.2.1
  intl: ^0.20.2
  pretty_dio_logger: ^1.4.0

dev_dependencies:
  flutter_launcher_icons: ^0.14.4
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.5
  bloc_test: ^10.0.0




flutter:
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/images/
    - assets/translations/

